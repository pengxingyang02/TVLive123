name: Build TVLive123 Java32
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python 3.8
        id: python38
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Manually install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-24" "build-tools;28.0.3"
        env:
          ANDROID_SDK_ROOT: $HOME/android-sdk

      - name: Switch to JDK11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: 替换国内Maven镜像
        run: |
          sed -i 's|https://repo.maven.apache.org/maven2|https://maven.aliyun.com/repository/public|g' build.gradle
          sed -i 's|https://plugins.gradle.org/m2|https://maven.aliyun.com/repository/gradle-plugin|g' build.gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PYTHON38_HOME=${{ steps.python38.path }}
          ./gradlew assembleJava32Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVLive123-Java32-APK
          path: output/apk/*.apk
